name: Render Manim Video

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "*.mp3"
      - ".github/workflows/render-manim.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: "Manim quality flag (-ql for 480p15, -qh for 1080p30)"
        required: true
        default: "-qh"
        type: choice
        options:
          - "-ql"
          - "-qm"
          - "-qh"

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Manim + FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            python3-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render Manim master scene
        env:
          QUALITY: ${{ github.event.inputs.quality || '-qh' }}
        run: |
          manim $QUALITY main.py MetabolicMasterManim

      - name: Locate rendered video and mux audio tracks
        run: |
          mkdir -p dist
          SILENT_MP4=$(find media/videos/main -name "MetabolicMasterManim.mp4" | head -n 1)
          echo "Found silent render: $SILENT_MP4"

          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$SILENT_MP4")
          FADE_OUT_START=$(python3 -c "print(max(0.0, float('$DUR') - 1.0))")

          if [ -f "voiceover.mp3" ] && [ -f "ambient-bed-v4.mp3" ] && [ -f "sfx.mp3" ]; then
            ffmpeg -y \
              -i "$SILENT_MP4" \
              -i "voiceover.mp3" \
              -stream_loop -1 -i "ambient-bed-v4.mp3" \
              -i "sfx.mp3" \
              -filter_complex "\
                [1:a]volume=1.0[vo]; \
                [2:a]volume=0.22,afade=t=in:st=0:d=1,afade=t=out:st=${FADE_OUT_START}:d=1[amb]; \
                [3:a]volume=0.6[sfx]; \
                [vo][amb][sfx]amix=inputs=3:duration=first:dropout_transition=0[aout]" \
              -map 0:v:0 -map "[aout]" \
              -c:v copy -c:a aac -b:a 192k \
              -shortest dist/MetabolicMasterManim.mp4
          else
            cp "$SILENT_MP4" dist/MetabolicMasterManim.mp4
          fi

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: metabolic-master-manim
          path: dist/MetabolicMasterManim.mp4
          retention-days: 30

      - name: Attach MP4 to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-render
          name: Latest Manim Render
          files: dist/MetabolicMasterManim.mp4
          prerelease: true
