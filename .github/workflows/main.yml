name: Render video

on:
  workflow_dispatch:
    inputs:
      folder:
        description: Project folder
        default: metabolic-score-studio-ar
      composition:
        description: Composition id
        default: MetabolicMasterAR
      output:
        description: Output file name
        default: prediabetes-explainer-ar.mp4

defaults:
  run:
    working-directory: ${{ inputs.folder }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npx remotion render src/index.ts ${{ inputs.composition }} out/${{ inputs.output }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output }}
          path: ${{ inputs.folder }}/out/${{ inputs.output }}
