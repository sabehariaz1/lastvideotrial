name: Render Manim Video

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "*.mp3"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: "Manim quality flag (-ql for 480p15, -qh for 1080p30)"
        required: true
        default: "-qh"
        type: choice
        options:
          - "-ql"
          - "-qm"
          - "-qh"

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Manim + FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install manim
          fi

      - name: Render Manim master scene
        run: |
          QUALITY="${{ inputs.quality || '-qh' }}"
          mkdir -p dist
          if [ -f main.py ]; then
            manim $QUALITY main.py
          else
            echo "Warning: main.py not found in repository root."
            exit 1
          fi

      - name: Locate rendered video and mux audio tracks
        run: |
          mkdir -p dist
          RENDERED_MP4=$(find media/videos -name "*.mp4" | head -n 1 || true)
          if [ -z "$RENDERED_MP4" ]; then
            echo "No rendered MP4 found under media/videos."
            exit 1
          fi
          if [ -f voiceover.mp3 ]; then
            ffmpeg -y -i "$RENDERED_MP4" -i voiceover.mp3 -c:v copy -c:a aac -b:a 192k -shortest dist/MetabolicMasterManim.mp4
          else
            cp "$RENDERED_MP4" dist/MetabolicMasterManim.mp4
          fi

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: metabolic-master-manim
          path: dist/MetabolicMasterManim.mp4
          retention-days: 30

      - name: Attach MP4 to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-render
          name: Latest Manim Render
          files: dist/MetabolicMasterManim.mp4
