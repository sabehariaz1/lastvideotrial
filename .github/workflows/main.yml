name: Render
on:
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Unzip project
        run: |
          test -f metabolic-update.zip
          rm -rf build && mkdir build
          unzip -q metabolic-update.zip -d build
          ls -R build/src build/public
      - run: npm install
        working-directory: build
      - run: npx tsc --noEmit
        working-directory: build
      - run: npx remotion render src/index.ts MetabolicMaster out/metabolic-master.mp4 --codec=h264 --crf=16 --pixel-format=yuv420p
        working-directory: build
      - uses: actions/upload-artifact@v4
        with:
          name: metabolic-master-${{ github.run_number }}
          path: build/out/metabolic-master.mp4
